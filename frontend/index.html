<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Nome do projeto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="entrada-pagina">

  <section class="entrada-lado">
    <span class="marca">Nome do projeto</span>
    <div>
      <h1>O que entrou, o que saiu e o que sobrou no mês.</h1>
      <p>Registre suas entradas e saídas, separe por categoria e acompanhe os limites que você mesmo definiu.</p>
    </div>
    <span class="rotulo">TDE 2 · Programação Web · PUCPR</span>
  </section>

  <section class="entrada-form">
    <!-- INTEGRAR: enviar via fetch (POST, JSON) para ../api/login.php.
         Sucesso -> window.location = 'logado/dashboard.php'. Erro -> texto em #msg-login. -->
    <form id="form-login" novalidate>
      <h2>Entrar</h2>
      <p class="sub">Use o e-mail e a senha do seu cadastro.</p>

      <div id="msg-login" class="msg erro" role="alert"></div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" maxlength="50" autocomplete="email" required>
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" autocomplete="current-password" required>
      </div>

      <label class="caixa">
        <input type="checkbox" data-mostrar-senha>
        <span class="caixa-marca"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 7.7002L6.64645 10.3466C6.84171 10.5419 7.15829 10.5419 7.35355 10.3466L12 5.7002" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></svg></span>
        Mostrar senha
      </label>

      <button type="submit" class="btn">Entrar</button>

      <p class="troca">Ainda não tem conta? <a class="link" href="cadastro.html">Criar conta</a></p>
    </form>
  </section>

</div>

<script src="js/app.js"></script>
</body>
</html>
